# Commands are non-interactive and idempotent. No GPU, no API keys required.
# CLAUDE_KEY + the `claude` CLI are optional: without them triage falls back to rules.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  # 1) localhost: bundled website with 21 planted faults (no network needed, ~3s)
  - "python src/main.py demo --exit-zero"
  # 2) the real target (needs internet, ~15s)
  - "python src/main.py check --url https://aintropy.ai/ --exit-zero"

test_commands:
  - "python -m pytest -q"
  # detection precision/recall, clean-site false positives, guardrails, speed/cost
  - "python src/evals/run_eval.py"

notes: >
  Reports are written to reports/<site>/latest.md and latest.json.
  `--exit-zero` is only there so the demo commands don't look like failures; without it
  the exit code is 0 healthy / 1 degraded / 2 unhealthy, for CI. If CLAUDE_KEY is set and the
  `claude` CLI is installed (npm i -g @anthropic-ai/claude-code), the triage step uses
  claude -p (haiku); `python src/evals/run_eval.py --llm` also evaluates that layer.
  See docs/README.md for the design, evals and guardrails.
