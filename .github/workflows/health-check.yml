name: website-health
on:
  schedule: [{cron: "*/30 * * * *"}]   # every 30 min
  workflow_dispatch:
  deployment_status:                    # also right after every deploy
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt && npm install -g @anthropic-ai/claude-code
      - uses: actions/cache@v4            # keeps last report -> diff + "notify on change" + triage cache
        with: {path: reports, key: "health-${{ github.run_id }}", restore-keys: "health-"}
      - name: Health check
        env:
          CLAUDE_KEY: ${{ secrets.CLAUDE_KEY }}
          HEALTH_WEBHOOK_URL: ${{ secrets.HEALTH_WEBHOOK_URL }}
          HEALTH_WEBHOOK_SECRET: ${{ secrets.HEALTH_WEBHOOK_SECRET }}
        run: python src/main.py check --config sites.yaml
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: health-report, path: reports/**/latest.*}
